<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDM - S Download Manager</title>
<link rel="icon" href="/ui/icon.png">
<link rel="stylesheet" href="/ui/style.css?v=2.1.1">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><span class="brand-word">SDM</span><span class="brand-dot"></span><span class="brand-ver" id="ver"></span></div>
      <div class="brand-sub">S Download Manager</div>
    </div>
    <nav class="nav" id="nav-status"><div class="label">Downloads</div></nav>
    <nav class="nav" id="nav-cat"><div class="label">Categories</div></nav>
    <div class="side-foot">
      <div class="link-pill" id="linkpill"><span class="sd"></span><div>Browser link<span class="sub" id="linksub">Checking…</span></div></div>
      <div class="foot-row">
        <button class="btn" id="btn-settings" title="Settings"><svg class="ico"><use href="#i-gear"/></svg>Settings</button>
        <button class="ibtn" id="btn-theme" title="Light / dark"><svg class="ico"><use href="#i-moon"/></svg></button>
        <button class="ibtn" id="btn-quit" title="Quit SDM engine"><svg class="ico"><use href="#i-power"/></svg></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <section class="top">
      <div class="widgets">
        <div class="widget speed-w">
          <div class="speed-head"><span class="label">Total speed</span><span class="label live" id="live"><i></i><span id="livetxt">Idle</span></span></div>
          <div class="speed-big"><div style="height:26px"></div><div class="speed-num" id="speed">0.0</div><div class="speed-unit" id="speedunit">MB/S</div></div>
          <canvas id="chart"></canvas>
        </div>
        <div class="widget stats-w">
          <div class="label">Overview</div>
          <div class="stat"><span class="label">Active</span><b id="st-active">0</b></div>
          <div class="stat"><span class="label">Queued</span><b id="st-queued">0</b></div>
          <div class="stat"><span class="label">Today</span><b id="st-today">0<small>MB</small></b></div>
          <div id="drives" class="drives"></div>
        </div>
      </div>
      <form class="addbar" id="addform" autocomplete="off">
        <svg class="ico"><use href="#i-link"/></svg>
        <input id="addurl" placeholder="Paste any link — file, video page, stream, FTP, magnet — or drop a .torrent file" spellcheck="false">
        <span class="kbd">CTRL+V</span>
        <button class="add-file" type="button" id="btn-tfile" title="Open .torrent file(s) from this computer"><svg class="ico"><use href="#i-magnet"/></svg><span>.torrent</span></button>
        <input type="file" id="tfile" accept=".torrent,application/x-bittorrent" multiple hidden>
        <button class="add-go" type="submit" title="Add download"><svg class="ico"><use href="#i-plus"/></svg></button>
      </form>
      <div class="listhead">
        <h2 id="listtitle">ALL</h2>
        <span class="spacer"></span>
        <button class="ibtn mini" id="btn-settings2" title="Settings"><svg class="ico"><use href="#i-gear"/></svg></button>
        <label class="search"><svg class="ico"><use href="#i-search"/></svg><input id="q" placeholder="Search" spellcheck="false"></label>
        <button class="btn sm ghost" id="btn-resumeall"><svg class="ico"><use href="#i-play"/></svg><span class="lbl">Resume all</span></button>
        <button class="btn sm ghost" id="btn-pauseall"><svg class="ico"><use href="#i-pause"/></svg>Pause all</button>
        <button class="btn sm ghost" id="btn-clear" title="Clear finished items from the list (files stay on disk)"><svg class="ico"><use href="#i-sweep"/></svg>Clear</button>
      </div>
    </section>
    <section class="list" id="list"></section>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div id="layer"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

</html>
